<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 44">
  <!-- Flying saucer with a little alien (sky event, night). Drawn for Higlo
       grid. The lights blink on their own (the style below). -->
  <style>
    .light { animation: blink 0.5s steps(2) infinite; }
    .light.late { animation-delay: -0.25s; }
    @keyframes blink { 50% { opacity: 0.3; } }
  </style>
  <ellipse cx="40" cy="17" rx="15" ry="13" fill="#b3e5fc" stroke="#4fc3f7" stroke-width="1.5"/>
  <circle cx="40" cy="16" r="5.5" fill="#81c784"/>
  <circle cx="38" cy="15" r="1.3" fill="#1b5e20"/><circle cx="42" cy="15" r="1.3" fill="#1b5e20"/>
  <ellipse cx="40" cy="27" rx="37" ry="10" fill="#90a4ae"/>
  <ellipse cx="40" cy="24" rx="37" ry="6" fill="#cfd8dc"/>
  <circle class="light" cx="18" cy="29" r="2.8" fill="#ffee58"/>
  <circle class="light late" cx="31" cy="31.5" r="2.8" fill="#ff8a65"/>
  <circle class="light" cx="49" cy="31.5" r="2.8" fill="#ffee58"/>
  <circle class="light late" cx="62" cy="29" r="2.8" fill="#ff8a65"/>
</svg>
