<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Higlo grid</title>
    <link rel="stylesheet" href="/css/style.css">
  </head>
  <body>
    <div id="banner" aria-live="polite"></div>
    <main>
      <div id="turnbar" aria-live="polite">
        <p id="turn-text">Joining…</p>
        <div id="turn-buttons">
          <button id="hot" type="button" hidden>🔥 Warmer</button>
          <button id="cold" type="button" hidden>❄️ Colder</button>
          <button id="next" type="button" hidden>Next ➜</button>
        </div>
      </div>
      <div id="grid" aria-label="Shared grid"></div>
      <p id="share">Share this link to play together: <span id="link"></span></p>
    </main>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
