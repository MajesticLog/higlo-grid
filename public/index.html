<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Higlo grid</title>
    <link rel="stylesheet" href="/css/style.css">
  </head>
  <body>
    <section id="lobby" hidden>
      <div id="pick" hidden>
        <h1>Who are you?</h1>
        <div id="preview" class="circle"><span class="animal">?</span></div>
        <h2><label for="name">Your name</label></h2>
        <input id="name" type="text" maxlength="20" autocomplete="nickname" enterkeyhint="done">
        <h2>Pick an animal</h2>
        <div id="animals" class="choices"></div>
        <h2>Pick a colour</h2>
        <div id="colours" class="choices"></div>
        <button id="pick-done" class="primary" type="button" disabled>Next ➜</button>
      </div>
      <form id="write" hidden>
        <h1>Hide a memory</h1>
        <p class="hint-text">It will be hidden under the grass. Find it together!</p>
        <p id="prompt"></p>
        <button id="new-prompt" class="quiet" type="button">Another idea ↻</button>
        <textarea id="memory" maxlength="300" rows="4" aria-labelledby="prompt"></textarea>
        <button id="hide" class="primary" type="submit">Hide it in the field 🌱</button>
        <button id="skip" class="quiet" type="button">Skip for now</button>
      </form>
      <p id="here"></p>
    </section>
    <main id="field" hidden>
      <div id="sky-strip" aria-hidden="true"><span id="sky-strip-icon">☀️</span></div>
      <div id="status" aria-live="polite">
        <p id="status-text">Joining…</p>
        <button id="ready" type="button" hidden>✓ Ready</button>
        <button id="end-open" type="button" hidden></button>
        <div id="timer" hidden><div></div></div>
      </div>
      <div id="board">
        <div id="grid" aria-label="Shared grid"></div>
        <div id="fireflies" aria-hidden="true" hidden></div>
      </div>
      <div id="new-game">
        <button id="new-game-ask" type="button">🔄 New game</button>
        <button id="sound" type="button">🔊 Sound on</button>
        <span id="new-game-confirm" hidden>
          Start a new board?
          <button id="new-game-yes" type="button">Yes</button>
          <button id="new-game-no" type="button">No</button>
        </span>
      </div>
    </main>
    <div id="card" role="dialog" aria-modal="true" aria-labelledby="card-text" hidden>
      <div class="card-body">
        <p class="card-found">📜 A memory!</p>
        <p id="card-prompt"></p>
        <p id="card-text"></p>
        <p id="card-author"></p>
        <button id="card-close" type="button">Close</button>
      </div>
    </div>
    <div id="end" role="dialog" aria-modal="true" aria-labelledby="end-title" hidden>
      <div class="end-body">
        <h2 id="end-title"></h2>
        <div id="end-family"></div>
        <p id="end-note"></p>
        <h3 id="end-memories-title">Memories found this game</h3>
        <ul id="end-memories"></ul>
        <div class="end-buttons">
          <button id="end-again" class="primary" type="button">🔄 Play again</button>
          <p id="end-waiting" hidden>✅ Waiting for the others to choose…</p>
          <button id="end-lobby" type="button">🏠 Back to the lobby</button>
          <button id="end-garden" class="quiet" type="button">🌼 See the garden</button>
        </div>
      </div>
    </div>
    <div id="sky" aria-hidden="true"><span id="sky-icon">☀️</span></div>
    <p id="share">Share this link to play together: <span id="link"></span></p>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
